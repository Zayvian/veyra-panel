name: Node CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: veyra-node
      - uses: actions/checkout@v4
        with:
          repository: Zayvian/veyra-core
          path: veyra-core
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: veyra-node/go.sum
      - working-directory: veyra-node
        run: go test -race -tags 'with_clash_api,with_v2ray_api,with_utls,with_acme,with_quic' ./...
      - working-directory: veyra-node
        run: bash -n deploy/install-node.sh && bash -n deploy/veyra-menu.sh && sh -n install.sh
      - working-directory: veyra-node
        run: CGO_ENABLED=0 go build -trimpath -tags 'with_clash_api,with_v2ray_api,with_utls,with_acme,with_quic' -o dist/veyra-node ./cmd/node
